<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GGSel-copy - витрина</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <button class="catalog-btn" id="catalogBtn" aria-haspopup="true" aria-expanded="false">
        <span class="catalog-btn__grid"></span> Каталог
      </button>

      <div class="search">
        <input class="search__input" type="text" placeholder="Игра, приложение или услуга..." />
        <button class="search__fav" title="Избранное" aria-label="Избранное">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 21s-7.5-4.7-10-9.2C.6 9 1.8 5.5 5 5c2-.3 3.7.8 4.7 2.3L12 10l2.3-2.7C15.3 5.8 17 4.7 19 5c3.2.5 4.4 4 3 6.8C19.5 16.3 12 21 12 21z"/>
          </svg>
        </button>
        <button class="search__go" title="Искать" aria-label="Искать">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" />
          </svg>
        </button>
      </div>

      <button class="account" title="Профиль" aria-label="Профиль">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5z" />
        </svg>
      </button>
    </div>

    <div class="catalog-menu" id="catalogMenu" hidden>
      <div class="catalog-menu__inner">
        <ul class="catalog-menu__side">
          <li class="is-active">Игры и игровые сервисы <span class="chev">›</span></li>
          <li>Игровые ценности <span class="soon">скоро</span></li>
          <li>Мобильные игры <span class="soon">скоро</span></li>
          <li>Сервисы и соцсети <span class="soon">скоро</span></li>
          <li>Программы <span class="soon">скоро</span></li>
        </ul>
        <div class="catalog-menu__cols" id="catalogCols"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="banner" id="banner">
      <div class="banner__track" id="bannerTrack"></div>
      <div class="banner__arrows">
        <button id="bannerPrev" aria-label="Назад">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18" /></svg>
        </button>
        <button id="bannerNext" aria-label="Вперёд">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18" /></svg>
        </button>
      </div>
      <div class="banner__dots" id="bannerDots"></div>
    </section>

    <section class="services" id="services"></section>

    <section class="topup">
      <div class="topup__brand">
        <span class="topup__logo">S</span>
        <div>
          <div class="topup__title">Пополнение Steam <span class="topup__badge">5%</span></div>
          <button class="topup__promo-toggle" id="promoToggle">Ввести промокод</button>
        </div>
      </div>

      <div class="topup__field">
        <input type="text" placeholder="Логин Steam" />
        <span class="topup__info" title="Логин вводить не нужно - как в макете">i</span>
      </div>

      <div class="topup__amount">
        <div class="topup__amount-label">Сумма</div>
        <div class="topup__amount-value" id="topupAmount">500 ₽</div>
        <div class="currency" id="currency">
          <button data-cur="$" class="is-active">$</button>
          <button data-cur="₸">₸</button>
          <button data-cur="₽">₽</button>
        </div>
      </div>

      <button class="topup__pay" id="topupPay">Оплатить 500$</button>

      <div class="topup__promo" id="promoBox" hidden>
        <input type="text" id="promoInput" placeholder="Промокод (WELCOME10, LIMIT3, ...)" />
        <button id="promoApply">Применить</button>
        <span class="topup__promo-result" id="promoResult"></span>
      </div>
    </section>

    <section class="catalog">
      <div class="catalog__head">
        <h2>Популярные товары</h2>
        <div class="chips" id="chips"></div>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal__box">
      <button class="modal__close" id="modalClose">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
